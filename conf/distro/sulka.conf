DISTRO = "sulka"
DISTRO_NAME = "Sulka"
DISTRO_VERSION = "0.5.1"
DISTRO_CODENAME = "Albatross"

TARGET_VENDOR = "-sulka"

SDK_VENDOR = "-sulkasdk"
SDK_VERSION = "${DISTRO_VERSION}"

MAINTAINER = "ejaaskel <esa.jaaskela@suomi24.fi>"

LOCALCONF_VERSION = "2"

# Aim for the following default feature set: acl ipv4 ipv6 integrity ldconfig pam seccomp security xattr
DISTRO_FEATURES:append = " pam integrity security"
DISTRO_FEATURES_OPTED_OUT ?= " \
    3g \
    alsa \
    bluetooth \
    debuginfod \
    ext2 \
    gobject-introspection-data \
    multiarch \
    nfc \
    nfs \
    opengl \
    pci \
    ptest \
    pulseaudio \
    vfat \
    vulkan \
    wayland \
    wifi \
    x11 \
    zeroconf \
"

SULKA_DEFAULT_EXTRA_RDEPENDS ?= "packagegroup-core-boot packagegroup-sulka packagegroup-sulka-netfilter-modules"
SULKA_DEFAULT_EXTRA_RRECOMMENDS ?= ""
DISTRO_EXTRA_RDEPENDS += " ${SULKA_DEFAULT_EXTRA_RDEPENDS}"
DISTRO_EXTRA_RRECOMMENDS += " ${SULKA_DEFAULT_EXTRA_RRECOMMENDS}"

VIRTUAL-RUNTIME_base-utils-syslog ?= "syslog-ng"

PREFERRED_VERSION_linux-yocto ?= "6.18%"
PREFERRED_VERSION_linux-yocto-rt ?= "6.18%"

PACKAGE_CLASSES ?= "package_rpm"

require conf/distro/include/rust_security_flags.inc

INHERIT += "uninative"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

INIT_MANAGER ?= "systemd"

KERNEL_EXTRA_FEATURES:append = " features/nf_tables/nf_tables.scc"

KERNEL_MODULE_AUTOLOAD:append = " \
    nf_log_syslog \
    nft_ct \
    nft_limit \
    nft_log \
"

IMAGE_FEATURES:remove = "splash"


INHERIT += "create-spdx variable-check"

IMAGE_CLASSES:append = " sbom-cve-check"
SRCREV:pn-sbom-cve-check-update-nvd-native = "${AUTOREV}"
SRCREV:pn-sbom-cve-check-update-cvelist-native = "${AUTOREV}"
SPDX_INCLUDE_VEX = "all"
SPDX_INCLUDE_COMPILED_SOURCES:pn-linux-yocto = "1"
include conf/distro/include/cve-extra-exclusions.inc

INHERIT += "extrausers"

INHERIT += "sulka-rootfs-postprocess"

SULKA_INSTALL_SSH_KEYS ??= "0"
INHERIT += "${@"sulka-install-ssh-keys" if d.getVar('SULKA_INSTALL_SSH_KEYS') == "1" else ""}"

SULKA_SERVICEUSER_USERNAME ??= "serviceuser"
SULKA_SERVICEUSER_PASSWORD ??= ""
SULKA_SERVICEUSER_HOME = "/home/${SULKA_SERVICEUSER_USERNAME}"
SULKA_SERVICEUSER_GROUPADD = " groupadd -g 1200 ${SULKA_SERVICEUSER_USERNAME};"
SULKA_SERVICEUSER_USERADD = " useradd -u 1200 -g 1200 -s /bin/sh -d ${SULKA_SERVICEUSER_HOME} -M -p '${SULKA_SERVICEUSER_PASSWORD}' ${SULKA_SERVICEUSER_USERNAME};"
EXTRA_USERS_PARAMS:append = "${@"${SULKA_SERVICEUSER_GROUPADD} ${SULKA_SERVICEUSER_USERADD}" if d.getVar('SULKA_SERVICEUSER_PASSWORD') else ""}"

SULKA_SERVICEUSER_ENABLE_SUDO ??= "0"

EXTRA_USERS_PARAMS:append = "\
    usermod -s /sbin/nologin root; \
    usermod -s /sbin/nologin sync; \
"

# Enable the read-only rootfs support
SULKA_ENABLE_READ_ONLY_ROOTFS ??= "1"
OVERRIDES:append = "${@":sulka-read-only-rootfs" if d.getVar('SULKA_ENABLE_READ_ONLY_ROOTFS') == "1" else ""}"
EXTRA_IMAGE_FEATURES:append:sulka-read-only-rootfs = " read-only-rootfs"
IMAGE_FSTYPES:append:sulka-read-only-rootfs = " erofs"
QB_DEFAULT_FSTYPE:sulka-read-only-rootfs = "erofs"
# Attempt to add ro kernel boot parameter. There doesn't seem to be one
# standard way of doing this
QB_KERNEL_ROOT:sulka-read-only-rootfs = "/dev/vda ro"
APPEND:append:sulka-read-only-rootfs = " ro "
CMDLINE:append:sulka-read-only-rootfs = " ro "

# Enable development mode. This option disables some security features and configurations that
# may be problematic during system development and debugging phases. It is recommended to keep
# this disabled for the production systems, but might be useful for other purposes
SULKA_DEVELOPMENT_MODE ??= "0"
OVERRIDES:append = "${@":sulka-development-mode" if d.getVar('SULKA_DEVELOPMENT_MODE') == "1" else ""}"

# Extra compliancy enables features that may not be the best fit for the
# embedded systems or that are outdated security advice but are still
# commonly required by audit tools and processes
SULKA_EXTRA_COMPLIANCY ??= "0"
OVERRIDES:append = "${@":sulka-compliancy" if d.getVar('SULKA_EXTRA_COMPLIANCY') == "1" else ""}"

# Option to enable password expiration. This is disabled by default, as the password expiration
# requirement does not translate well into the embedded devices. However, if you have a system
# where logins are often performed, consider enabling password expiration. Also, if
# SULKA_EXTRA_COMPLIANCY is enabled, enable password expiration
SULKA_EXPIRE_PASSWORDS ??= "0"
SULKA_EXPIRE_PASSWORDS:sulka-compliancy = "1"
OVERRIDES:append = "${@":sulka-expire-passwords" if d.getVar('SULKA_EXPIRE_PASSWORDS') == "1" else ""}"

# Option to enable the kernel hardening. Enabled by default, this feature enables plenty of
# kernel hardening and security measures. The kernel metadata is in the meta-sulka-kernel
# meta-layer. Graphics can also be enabled or disabled to cut the kernel attack surface and
# size.
SULKA_HARDEN_KERNEL ??= "1"
OVERRIDES:append = "${@":sulka-harden-kernel" if d.getVar('SULKA_HARDEN_KERNEL') == "1" else ""}"

SULKA_DISABLE_GRAPHICS ??= "1"
OVERRIDES:append = "${@":sulka-disable-graphics" if d.getVar('SULKA_DISABLE_GRAPHICS') == "1" else ""}"

# Option to set the mandatory access control module. Currently, accepted values are "none" and
# "selinux". Other values have the same effect as "none", i.e. no effect.
SULKA_MANDATORY_ACCESS_CONTROL_MODULE ??= "selinux"
DISTRO_EXTRA_RDEPENDS:append = "${@" packagegroup-selinux-minimal " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
DISTRO_EXTRA_RDEPENDS:append = "${@" restorecon-post-mount " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" and d.getVar('INIT_MANAGER') == "sysvinit" else ""}"
DISTRO_FEATURES:append = "${@" selinux " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
IMAGE_CLASSES:append = "${@" selinux-image " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
PREFERRED_PROVIDER_virtual/refpolicy ?= "refpolicy-targeted"

# Option to enable module signing.
SULKA_ENABLE_MODULE_SIGNING ??= "0"
DISTRO_FEATURES:append = "${@" ima modsign " if d.getVar('SULKA_ENABLE_MODULE_SIGNING') == "1" else ""}"

USE_VT:sulka-disable-graphics = "0"

SULKA_FSTAB_EXTRA_LINES ??= ""

SULKA_SSH_PORT ??= "22"

SULKA_ENABLE_MONITORING ??= "0"
SULKA_ENABLE_MONITORING:sulka-compliancy = "1"
SULKA_DEFAULT_EXTRA_RDEPENDS:append = "${@" packagegroup-sulka-monitoring " if d.getVar('SULKA_ENABLE_MONITORING') == "1" else ""}"

# GPLv3 excludes and configurations
# kbd-keymaps-pine is GPLv3 licensed
PACKAGE_EXCLUDE:append = " kbd-keymaps-pine"
# readline is GPLv3 licensed, so configure packages not to use it
PACKAGECONFIG:remove:pn-gawk = "readline"
PACKAGECONFIG:remove:pn-nftables = "readline"
# Use uutils-coreutils as it has more permissive license than coreutils
PREFERRED_PROVIDER_coreutils = "uutils-coreutils"
# QEMU machine has GNU tar as dependency, remove it
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "tar"
