DISTRO = "sulka"
DISTRO_NAME = "Sulka"
DISTRO_VERSION = "0.0.1"
DISTRO_CODENAME = "Albatross"

TARGET_VENDOR = "-sulka"

SDK_VENDOR = "-sulkasdk"
SDK_VERSION="${DISTRO_VERSION}"

MAINTAINER = "ejaaskel <esa.jaaskela@suomi24.fi>"

LOCALCONF_VERSION = "2"

SULKA_DEFAULT_DISTRO_FEATURES ?= "acl ipv4 ipv6 xattr seccomp ldconfig pam"
SULKA_DEFAULT_EXTRA_RDEPENDS ?= "packagegroup-core-boot packagegroup-sulka packagegroup-sulka-netfilter-modules"
SULKA_DEFAULT_EXTRA_RRECOMMENDS ?= ""

DISTRO_FEATURES ?= "${SULKA_DEFAULT_DISTRO_FEATURES}"
DISTRO_FEATURES_BACKFILL_CONSIDERED ?= "pulseaudio gobject-introspection-data"
DISTRO_EXTRA_RDEPENDS += " ${SULKA_DEFAULT_EXTRA_RDEPENDS}"
DISTRO_EXTRA_RRECOMMENDS += " ${SULKA_DEFAULT_EXTRA_RRECOMMENDS}"

VIRTUAL-RUNTIME_base-utils-syslog ?= "rsyslog"

TCLIBCAPPEND = ""

PREFERRED_VERSION_linux-yocto ?= "6.6%"
PREFERRED_VERSION_linux-yocto-rt ?= "6.6%"

PACKAGE_CLASSES ?= "package_rpm"

require conf/distro/include/no-static-libs.inc
require conf/distro/include/yocto-uninative.inc
require conf/distro/include/security_flags.inc
require conf/distro/include/rust_security_flags.inc

INHERIT += "uninative"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

INIT_MANAGER ?= "sysvinit"

KERNEL_EXTRA_FEATURES:append = " features/nf_tables/nf_tables.scc"

KERNEL_MODULE_AUTOLOAD:append = " \
    nf_log_syslog \
    nft_ct \
    nft_limit \
    nft_log \
"

IMAGE_FEATURES:remove = "splash"

INHERIT += "cve-check create-spdx variable-check"
include conf/distro/include/cve-extra-exclusions.inc

INHERIT += "extrausers"

INHERIT += "sulka-rootfs-postprocess"

SULKA_INSTALL_SSH_KEYS ??= "0"
INHERIT += "${@"sulka-install-ssh-keys" if d.getVar('SULKA_INSTALL_SSH_KEYS') == "1" else ""}"

SULKA_SERVICEUSER_USERNAME ??= "serviceuser"
SULKA_SERVICEUSER_PASSWORD ??= ""
SULKA_SERVICEUSER_HOME = "/home/${SULKA_SERVICEUSER_USERNAME}"
SULKA_SERVICEUSER_GROUPADD = " groupadd -g 1200 ${SULKA_SERVICEUSER_USERNAME};"
SULKA_SERVICEUSER_USERADD = " useradd -u 1200 -g 1200 -s /bin/sh -d ${SULKA_SERVICEUSER_HOME} -M -p '${SULKA_SERVICEUSER_PASSWORD}' ${SULKA_SERVICEUSER_USERNAME};"
EXTRA_USERS_PARAMS:append = "${@"${SULKA_SERVICEUSER_GROUPADD} ${SULKA_SERVICEUSER_USERADD}" if d.getVar('SULKA_SERVICEUSER_PASSWORD') else ""}"

EXTRA_USERS_PARAMS:append = "\
    usermod -s /sbin/nologin root; \
    usermod -s /sbin/nologin sync; \
"

# Extra compliancy enables features that may not be the best fit for the
# embedded systems or that are outdated security advice but are still
# commonly required by audit tools and processes
SULKA_EXTRA_COMPLIANCY ??= "0"
OVERRIDES:append = "${@":sulka-compliancy" if d.getVar('SULKA_EXTRA_COMPLIANCY') == "1" else ""}"

# Option to enable password expiration. This is disabled by default, as the password expiration
# requirement does not translate well into the embedded devices. However, if you have a system
# where logins are often performed, consider enabling password expiration. Also, if
# SULKA_EXTRA_COMPLIANCY is enabled, enable password expiration
SULKA_EXPIRE_PASSWORDS ??= "0"
SULKA_EXPIRE_PASSWORDS:sulka-compliancy = "1"
OVERRIDES:append = "${@":sulka-expire-passwords" if d.getVar('SULKA_EXPIRE_PASSWORDS') == "1" else ""}"

SULKA_DISABLE_GRAPHICS = "1"
OVERRIDES:append = "${@":sulka-disable-graphics" if d.getVar('SULKA_DISABLE_GRAPHICS') == "1" else ""}"

# Option to set the mandatory access control module. Currently, accepted values are "none" and
# "selinux". Other values have the same effect as "none", i.e. no effect.
SULKA_MANDATORY_ACCESS_CONTROL_MODULE ??= "selinux"
DISTRO_EXTRA_RDEPENDS:append = "${@" packagegroup-core-selinux " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
DISTRO_FEATURES:append = "${@" selinux " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
IMAGE_CLASSES:append = "${@" selinux-image " if d.getVar('SULKA_MANDATORY_ACCESS_CONTROL_MODULE') == "selinux" else ""}"
PREFERRED_PROVIDER_virtual/refpolicy ?= "refpolicy-targeted"

USE_VT:sulka-disable-graphics = "0"

SULKA_FSTAB_EXTRA_LINES ??= ""

SULKA_SSH_PORT ??= "22"

SULKA_ENABLE_MONITORING ??= "0"
SULKA_ENABLE_MONITORING:sulka-compliancy = "1"
SULKA_DEFAULT_EXTRA_RDEPENDS:append = "${@" packagegroup-sulka-monitoring " if d.getVar('SULKA_ENABLE_MONITORING') == "1" else ""}"
